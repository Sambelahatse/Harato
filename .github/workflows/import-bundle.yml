name: Import HARATO source bundle
on:
  push:
    branches: [main]
    paths:
      - harato-bundle.trigger
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack project into repository root
        run: |
          cat harato-bundle-*.part | base64 -d > /tmp/harato-source.tar.gz
          tar -xzf /tmp/harato-source.tar.gz
          rm -f harato-bundle-*.part harato-bundle.trigger
          rm -f .github/workflows/import-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add HARATO full-stack application"
          git push origin main
