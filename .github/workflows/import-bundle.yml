name: Import HARATO source bundle
on:
  push:
    branches: [main]
    paths:
      - harato-source.tar.gz.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack project into repository root
        run: |
          python - <<'PY'
          import base64, os, tarfile
          with open("harato-source.tar.gz.b64", "rb") as f:
              payload = base64.b64decode(f.read())
          with open("/tmp/harato-source.tar.gz", "wb") as f:
              f.write(payload)
          with tarfile.open("/tmp/harato-source.tar.gz", "r:gz") as archive:
              archive.extractall(".", filter="data")
          os.remove("harato-source.tar.gz.b64")
          os.remove(".github/workflows/import-bundle.yml")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add HARATO full-stack application"
          git push origin main
